<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Zapli</title>
<style>
:root { color-scheme: light dark; --bg: #fbfaff; --fg: #1b1b21; --muted: #46464f; --accent: #3a37d6; }
@media (prefers-color-scheme: dark) { :root { --bg: #131318; --fg: #e5e1e9; --muted: #c7c5d0; --accent: #c0c1ff; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 44rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .5rem; color: var(--accent); }
h2 { font-size: 1.2rem; margin: 2rem 0 .5rem; }
li { margin: .4rem 0; }
strong { font-weight: 650; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Zapli</h1>
<p>Zapli installs and runs small apps (“tools”) on your phone. What you keep in them stays on the phone.</p>
<p><a href="privacy/">Privacy policy</a></p>
</main>
</body>
</html>
